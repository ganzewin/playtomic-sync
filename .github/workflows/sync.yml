name: Playtomic Calendar Sync

on:
  schedule:
    # Draait elke 30 minuten
    - cron: '*/30 * * * *'
  workflow_dispatch: # Zorgt ervoor dat je het ook handmatig kunt starten via de GitHub knop

jobs:
  sync:
    runs-runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib

    - name: Run Playtomic Sync Script
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
      run: python sync.py
