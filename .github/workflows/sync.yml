name: Playtomic Calendar Sync

on:
  schedule:
    # Draait op minuut 12 en minuut 42 van elk uur om GitHub-pieken te omzeilen
    - cron: '12,42 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Virtual Environment
        run: |
          python3 -m venv venv
          ./venv/bin/pip install --upgrade pip
          if [ -f requirements.txt ]; then ./venv/bin/pip install -r requirements.txt; fi

      - name: Run Playtomic Sync Script
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        run: ./venv/bin/python sync.py

      - name: Voorkom dat repository in slaap valt
        uses: gautamkrishnar/keepalive-workflow@v2
